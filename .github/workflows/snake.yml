# Redraws the contribution graph as a snake every day, onto the "output" branch the README shows.
name: Snake

on:
  schedule:
    - cron: "0 6 * * *" # 07:00 in Lagos
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#ff5fa2&color_dots=#f3e8ff,#e9d5ff,#c4b5fd,#a78bfa,#7c3aed
            dist/snake-dark.svg?palette=github-dark&color_snake=#ff5fa2&color_dots=#161b22,#3b1f5c,#5b2d91,#7c3aed,#c084fc

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
